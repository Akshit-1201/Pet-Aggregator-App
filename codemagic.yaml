# Codemagic CI — builds the iOS release and ships it to TestFlight.
#
# SECRETS: nothing credential-bearing is in this file. The App Store Connect .p8
# and the certificate private key are read at build time from encrypted
# Codemagic environment variables and are never echoed. The issuer and key IDs
# are variables too rather than literals — they identify the App Store Connect
# account, and this file is committed.
#
# Required variables (Codemagic -> app settings -> Environment variables).
# Mark every one of them Secure:
#
#   AUTH_KEY                          contents of the App Store Connect .p8 file
#   CERTIFICATE_KEY                   signing certificate private key
#   APP_STORE_CONNECT_ISSUER_ID       App Store Connect issuer ID
#   APP_STORE_CONNECT_KEY_IDENTIFIER  App Store Connect key ID
#
# AUTH_KEY and CERTIFICATE_KEY already exist from the workflow-editor setup. The
# two IDs were injected by the UI and so have to be added by hand for this
# workflow to see them.

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Deliberately no `triggering:` block — builds are started by hand. An
    # automatic trigger on pull_request would run branch-supplied code on a
    # machine holding the distribution certificate and the App Store Connect
    # key, which is enough to sign and publish a build as us.

    environment:
      # Codemagic requires every application variable to belong to a group, and
      # a group is only visible to the workflow that imports it here. Without
      # this, each reference below expands to an empty string rather than
      # erroring, and the build dies in fetch-signing-files with
      # `argument --issuer-id: Provided value "" is not valid`.
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.pawgopets.app
      flutter: 3.47.1
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Initialise the keychain
        # The declarative `ios_signing:` block does this implicitly. Fetching the
        # signing files by hand does not, and without a keychain the certificate
        # never reaches xcodebuild — the archive then fails to sign.
        script: keychain initialize

      - name: Fetch App Store distribution signing files
        # IOS_APP_STORE, *not* IOS_APP_DEVELOPMENT. TestFlight requires
        # distribution signing, and a development profile cannot even be created
        # unless a test device is registered on the Developer Portal — which is
        # what the earlier red builds died on.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @env:AUTH_KEY \
            --certificate-key @env:CERTIFICATE_KEY \
            --create

      - name: Add the fetched certificate to the keychain
        script: keychain add-certificates

      - name: Apply the fetched provisioning profile to the Xcode project
        # Rewrites Runner's signing settings to use the profile fetched above,
        # and writes /Users/builder/export_options.plist for the build.
        script: xcode-project use-profiles

      - name: Build the IPA
        # No standalone `pod install`: this repo has no ios/Podfile, and
        # `flutter build ipa` generates one and runs CocoaPods itself.
        # TestFlight refuses a CFBundleVersion it has already accepted, so the
        # build number comes from Codemagic's per-app counter.
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $AUTH_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Goes to TestFlight for internal testers. Adding `beta_groups:` would
        # push to external groups, which triggers Apple's beta review.
        submit_to_testflight: true
